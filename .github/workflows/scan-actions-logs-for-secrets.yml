name: Scan Actions logs for secrets

on:
  workflow_run:
    workflows:
      - "Agent explo"
      - "Continuous Deployment"
      - "Backup DB scalingo & copy to clever"
      - "External SIRET E2E"
      - "Load tests"
      - "PR Checklist"
      - "PR Analytics"
      - "Renew INSEE password"
      - "Copy prod (secnum) DB to nightly (secnum-nightly) DB"
      - "Validation PR"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  scan-logs:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      SCAN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/gitleaks-actions-logs.toml
            .github/scripts/report-secrets-in-logs.ts
          sparse-checkout-cone-mode: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Download logs of the completed run
        run: |
          set -euo pipefail
          mkdir run-logs
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion != "skipped") | { id, name }' \
            | jq -s . > jobs.json
          for job_id in $(jq -r '.[].id' jobs.json); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "run-logs/${job_id}.log" \
              || echo "::warning::Logs indisponibles pour le job ${job_id}"
          done

      - name: Scan logs
        id: scan
        run: |
          set -euo pipefail
          # Rapport non masqué : ne jamais l'afficher ni le téléverser, ce dépôt et ses logs sont publics.
          gitleaks dir run-logs \
            --config .github/gitleaks-actions-logs.toml \
            --no-banner \
            --log-level warn \
            --exit-code 0 \
            --report-format json \
            --report-path "${RUNNER_TEMP}/findings.json"
          echo "findings_count=$(jq length "${RUNNER_TEMP}/findings.json")" >> "${GITHUB_OUTPUT}"

      - name: Delete logs of the scanned run
        id: delete-logs
        if: steps.scan.outputs.findings_count != '0'
        continue-on-error: true
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs"

      - uses: actions/setup-node@v7
        if: steps.scan.outputs.findings_count != '0'
        with:
          node-version: '24.14.0'

      - name: Build redacted report
        id: report
        if: steps.scan.outputs.findings_count != '0'
        continue-on-error: true
        env:
          LOGS_DELETION_OUTCOME: ${{ steps.delete-logs.outcome }}
        run: |
          trap 'rm -f "${RUNNER_TEMP}/findings.json"' EXIT
          node .github/scripts/report-secrets-in-logs.ts \
            run-logs jobs.json "${RUNNER_TEMP}/findings.json" "${RUNNER_TEMP}/slack-messages.json"

      - name: Notify Slack
        if: steps.scan.outputs.findings_count != '0'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          messages="${RUNNER_TEMP}/slack-messages.json"

          post_to_slack() {
            local response
            response="$(curl -sS --fail "https://slack.com/api/chat.postMessage" \
              -H "Content-Type: application/json; charset=utf-8" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -d @-)"
            if [ "$(jq -r '.ok' <<< "${response}")" != "true" ]; then
              echo "Slack error: $(jq -r '.error' <<< "${response}")" >&2
              return 1
            fi
            jq -c '{ channel, ts }' <<< "${response}"
          }

          if [ "${REPORT_OUTCOME}" != "success" ]; then
            jq -n --arg run "${RUN_URL}" --arg scan "${SCAN_URL}" \
              '["🚨 <!subteam^S089GE2GKEH|@if-devs> Secret potentiel dans les logs de <\($run)|ce run>, rapport indisponible : <\($scan)|voir le scan>"]' \
              > "${messages}"
          fi

          alert="$(jq '{ channel: "#if-dev", text: .[0], unfurl_links: false, unfurl_media: false }' "${messages}" | post_to_slack)"

          jq -c --argjson alert "${alert}" \
            '.[1:][] | { channel: $alert.channel, thread_ts: $alert.ts, text: ., unfurl_links: false, unfurl_media: false }' \
            "${messages}" \
            | while read -r message; do post_to_slack <<< "${message}" > /dev/null; done

      - name: Fail when secrets were found
        if: steps.scan.outputs.findings_count != '0'
        run: exit 1
