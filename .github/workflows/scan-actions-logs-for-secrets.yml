name: Scan Actions logs for secrets

on:
  workflow_run:
    workflows:
      - "Agent explo"
      - "Build back"
      - "Build front"
      - "Tag version"
      - "Continuous Deployment"
      - "Backup DB scalingo & copy to clever"
      - "Deploy DBT app to nightly"
      - "Generic workflow to deploy to scalingo, given arguments"
      - "External SIRET E2E"
      - "Fullcheck of the project + integration tests"
      - "Generate new release (from latest release)"
      - "Load tests"
      - "PR Checklist"
      - "PR Analytics"
      - "Renew INSEE password"
      - "Copy prod (secnum) DB to nightly (secnum-nightly) DB"
      - "Validation PR"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  scan-logs:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      SCAN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/gitleaks-actions-logs.toml
            .github/scripts/build-redacted-log-excerpts.py
          sparse-checkout-cone-mode: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Download logs of the completed run
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" > run-logs.zip

      - name: Scan logs
        id: scan
        run: |
          set -uo pipefail
          # --redact : le rapport et la sortie de ce job sont publics, aucune valeur ne doit y apparaître.
          gitleaks dir run-logs.zip \
            --config .github/gitleaks-actions-logs.toml \
            --max-archive-depth 1 \
            --redact \
            --no-banner \
            --log-level warn \
            --exit-code 0 \
            --report-format json \
            --report-path findings.json

          findings_count="$(jq length findings.json)"
          echo "findings_count=${findings_count}" >> "${GITHUB_OUTPUT}"

          if [ "${findings_count}" = "0" ]; then
            echo "Aucun secret détecté dans les logs de ${WORKFLOW_NAME} (${RUN_URL})."
            exit 0
          fi

          echo "${findings_count} secret(s) potentiel(s) dans les logs de ${WORKFLOW_NAME} (${RUN_URL}) :"
          jq -r '.[]
            | "- règle \(.RuleID), \(.File | sub(".*run-logs\\.zip!"; "")), ligne \(.StartLine)"
              + ((.Match | capture("(?<name>[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|PRIVATE_KEY|API_KEY)[A-Z0-9_]*)")? | ", variable \(.name)") // "")' \
            findings.json

      - name: Build redacted log excerpts
        id: excerpts
        if: steps.scan.outputs.findings_count != '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          findings_with_secrets="${RUNNER_TEMP}/findings-with-secrets.json"
          trap 'rm -f "${findings_with_secrets}"' EXIT
          # Rapport non masqué : reste sur le runner, ne doit jamais être affiché ni téléversé.
          gitleaks dir run-logs.zip \
            --config .github/gitleaks-actions-logs.toml \
            --max-archive-depth 1 \
            --no-banner \
            --log-level error \
            --exit-code 0 \
            --report-format json \
            --report-path "${findings_with_secrets}"
          python3 -I .github/scripts/build-redacted-log-excerpts.py \
            run-logs.zip "${findings_with_secrets}" "${RUNNER_TEMP}/excerpts.json"

      - name: Delete logs of the scanned run
        id: delete-logs
        if: steps.scan.outputs.findings_count != '0'
        continue-on-error: true
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs"

      - name: Notify Slack
        if: steps.scan.outputs.findings_count != '0'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings_count }}
          LOGS_DELETION_OUTCOME: ${{ steps.delete-logs.outcome }}
          EXCERPTS_OUTCOME: ${{ steps.excerpts.outcome }}
        run: |
          set -euo pipefail

          post_to_slack() {
            local response
            response="$(curl -sS --fail --location "https://slack.com/api/chat.postMessage" \
              -H "Content-Type: application/json; charset=utf-8" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -d @-)"
            if [ "$(jq -r '.ok' <<< "${response}")" != "true" ]; then
              echo "Slack error: $(jq -r '.error' <<< "${response}")" >&2
              return 1
            fi
            jq -c '{ channel, ts }' <<< "${response}"
          }

          if [ "${LOGS_DELETION_OUTCOME}" = "success" ]; then
            logs_status="Les logs du run ont été supprimés."
          else
            logs_status="⚠️ La suppression automatique des logs a échoué : les supprimer à la main."
          fi

          if [ "${EXCERPTS_OUTCOME}" = "success" ]; then
            excerpts_status="Extrait des logs concernés, secrets masqués, dans le fil."
          else
            excerpts_status="L'extrait masqué des logs n'a pas pu être construit : voir le job de scan."
          fi

          alert="$(jq -n \
            --arg channel "#if-prod-déploiement" \
            --arg header "🚨 Secret potentiel dans les logs GitHub Actions" \
            --arg text "<!subteam^S089GE2GKEH|@if-devs> ${FINDINGS_COUNT} secret(s) potentiel(s) dans les logs de *${WORKFLOW_NAME}*. ${logs_status} ${excerpts_status} Changer les secrets concernés." \
            --arg run "${RUN_URL}" \
            --arg scan "${SCAN_URL}" \
            '{
              channel: $channel,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header } },
                { type: "section", text: { type: "mrkdwn", text: $text } },
                {
                  type: "actions",
                  elements: [
                    { type: "button", style: "danger", text: { type: "plain_text", text: "Voir le scan" }, url: $scan },
                    { type: "button", text: { type: "plain_text", text: "Voir le run concerné" }, url: $run }
                  ]
                }
              ]
            }' | post_to_slack)"

          if [ "${EXCERPTS_OUTCOME}" != "success" ]; then
            exit 0
          fi

          jq -c '.[]' "${RUNNER_TEMP}/excerpts.json" | while read -r excerpt; do
            jq -n \
              --argjson alert "${alert}" \
              --argjson excerpt "${excerpt}" \
              '{ channel: $alert.channel, thread_ts: $alert.ts, text: ("```\n" + $excerpt + "```") }' \
              | post_to_slack > /dev/null
          done

      - name: Fail when secrets were found
        if: steps.scan.outputs.findings_count != '0'
        run: exit 1
