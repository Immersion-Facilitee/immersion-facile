name: "Validation PR"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested

jobs:
  detect-already-tested-code:
    name: "Detect already tested code"
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_already_tested: ${{ steps.compare.outputs.code_already_tested }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          PR_NUMBER=$(echo "$MERGE_GROUP_HEAD_REF" | sed -E 's|.*/pr-([0-9]+)-.*|\1|')
          PR_HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          PR_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD_SHA" --jq .tree.sha)
          MERGE_GROUP_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MERGE_GROUP_HEAD_SHA" --jq .tree.sha)
          PR_COMMITS_BEHIND_BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MERGE_GROUP_BASE_SHA...$PR_HEAD_SHA" --jq .behind_by)

          CODE_ALREADY_TESTED=false
          if [ "$PR_TREE" = "$MERGE_GROUP_TREE" ] && [ "$PR_COMMITS_BEHIND_BASE" = "0" ]; then
            CODE_ALREADY_TESTED=true
          fi
          echo "PR #$PR_NUMBER, code déjà testé sur la PR : $CODE_ALREADY_TESTED"
          echo "code_already_tested=$CODE_ALREADY_TESTED" >> "$GITHUB_OUTPUT"
  fullcheck:
    needs: detect-already-tested-code
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event.pull_request.draft == false) }}
    uses: ./.github/workflows/fullcheck.yml
    with:
      code_already_tested: ${{ needs.detect-already-tested-code.outputs.code_already_tested == 'true' }}
    secrets:
      API_KEY_OPEN_CAGE_DATA_GEOCODING: ${{ secrets.API_KEY_OPEN_CAGE_DATA_GEOCODING }}
      API_KEY_OPEN_CAGE_DATA_GEOSEARCH: ${{ secrets.API_KEY_OPEN_CAGE_DATA_GEOSEARCH }}
      PC_USERNAME: ${{ secrets.PC_USERNAME }}
      PC_PASSWORD: ${{ secrets.PC_PASSWORD }}
      PC_ADMIN_PASSWORD: ${{ secrets.PC_ADMIN_PASSWORD }}
      PRO_CONNECT_CLIENT_SECRET: ${{ secrets.PRO_CONNECT_CLIENT_SECRET}}
  verify-migration-order:
    name: "Verify migration order"
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - run: |
          pnpm back verify-migrations-order
