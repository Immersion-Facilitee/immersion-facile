version: 2

models:
  - name: broadcast_feedbacks
    description: |
      Convention broadcast feedbacks (France Travail and API subscribers), successes and errors,
      with the convention agency. Contains no personal data.
      Replaces the Metabase V1 broadcast_feedbacks question and view_conventions_errored view:
      the latest broadcast of a convention is the one with the most recent occurred_at.
      Grain: 1 row per broadcast feedback.
    columns:
      - name: id
        description: Primary key - ID of the broadcast feedback
        tests:
          - unique
          - not_null
      - name: convention_id
        description: UUID of the broadcasted convention
      - name: occurred_at
        description: Timestamp of the broadcast
      - name: consumer_name
        description: Name of the broadcast recipient (France Travail or API consumer)
      - name: error_message
        description: Error message of the failed broadcast, null when it succeeded
      - name: http_status
        description: HTTP status returned by the recipient, null on network errors
      - name: error_kind
        description: |
          functional when error_message is one of the business errors known by the application
          (shared functionalBroadcastFeedbackErrorMessage), technical otherwise, null when the broadcast succeeded
      - name: technical_error_response_body
        description: Body returned by the recipient, only for technical errors
      - name: handled_by_agency
        description: Whether the agency marked the error as handled
      - name: convention_status
        description: Status of the convention when it was broadcasted
      - name: agency_id
        description: UUID of the convention agency
      - name: agency_kind
        description: Kind of the convention agency (e.g. mission-locale, france-travail)
      - name: agency_department_code
        description: Department code of the convention agency
